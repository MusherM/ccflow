name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org

      - name: Set up npm for publishing
        run: npm install -g npm@11

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        run: npm run verify:release-version

      - name: Typecheck
        run: npm run typecheck

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Verify installable package
        run: npm run verify:install

      - name: Pack GitHub release asset
        run: |
          mkdir -p release-artifacts
          npm pack --pack-destination release-artifacts

      - name: Prepare GitHub release notes
        run: |
          package_name="$(node -p "require('./package.json').name")"
          {
            echo "TODO: write changelog before publishing this release."
            echo
            echo "npm package: https://www.npmjs.com/package/${package_name}"
          } > release-notes.md

      - name: Create draft GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
